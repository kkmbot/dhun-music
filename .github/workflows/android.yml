name: Android APK

on:
  push:
    branches: [main, master]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci

      - name: Copy app files into the Android project
        run: npx cap sync android

      - name: Build APK
        working-directory: android/android
        run: |
          chmod +x gradlew
          # android/VERSION holds the versionCode (bump it for each new release; phones update only to a higher code).
          # android/VERSION_NAME (optional) is the name people see; without it the name is 1.0.<code>.
          VERSION_CODE=$(cat ../VERSION 2>/dev/null | tr -dc 0-9)
          [ -n "$VERSION_CODE" ] || VERSION_CODE=$(( ${{ github.run_number }} + 1 ))
          VERSION_NAME=$(cat ../VERSION_NAME 2>/dev/null | tr -dc 0-9.)
          [ -n "$VERSION_NAME" ] || VERSION_NAME=1.0.$VERSION_CODE
          ./gradlew assembleRelease --no-daemon \
            -PdhunVersionCode=$VERSION_CODE \
            -PdhunVersionName=$VERSION_NAME
          mkdir -p ../../dist
          cp app/build/outputs/apk/release/app-release.apk ../../dist/Dhun-v$VERSION_NAME.apk
          echo "VERSION=$VERSION_NAME" >> $GITHUB_ENV
        env:
          DHUN_KEYSTORE_BASE64: ${{ secrets.DHUN_KEYSTORE_BASE64 }}
          DHUN_KEYSTORE_PASSWORD: ${{ secrets.DHUN_KEYSTORE_PASSWORD }}
          DHUN_KEY_ALIAS: ${{ secrets.DHUN_KEY_ALIAS }}
          DHUN_KEY_PASSWORD: ${{ secrets.DHUN_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: Dhun-v${{ env.VERSION }}
          path: dist/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Dhun ${{ env.VERSION }}
          make_latest: true
          files: dist/*.apk
          body: |
            Dhun Android app. Phone pe ye APK download karo aur install karo.
            (Pehli baar: "Install unknown apps" allow karna hoga. Details README me.)
