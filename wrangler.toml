# Example Cloudflare Workers config (free plan is enough to start).
# Secrets are NOT stored here: set them with `npx wrangler secret put BOT_TOKEN` etc.
name = "dhun"
main = "site/_worker.js"
compatibility_date = "2024-11-01"

[assets]
directory = "site"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "dhun"
database_id = "replace-with-your-d1-database-id"

[vars]
BOT_USERNAME = "your_bot_username"
PUBLIC_URL = "https://dhun.your-subdomain.workers.dev/"
